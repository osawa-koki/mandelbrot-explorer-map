<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="マンデルブロ集合を地図アプリのように探索できる Web アプリ（Rust + WebAssembly）" />
    <meta name="theme-color" content="#000000" />
    <title>Mandelbrot Explorer Map</title>
    <link rel="icon" id="favicon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="canvas" aria-label="マンデルブロ集合の地図"></canvas>

    <details id="panel" class="panel" open>
      <summary>Mandelbrot Explorer</summary>
      <div class="panel-body">
        <label for="colorScheme">カラースキーム</label>
        <select id="colorScheme"></select>

        <label for="maxIter">最大反復回数</label>
        <select id="maxIter"></select>

        <label class="checkbox">
          <input id="antialias" type="checkbox" />
          アンチエイリアス（4 倍の計算）
        </label>

        <div class="buttons">
          <button id="resetBtn" type="button">初期位置に戻す</button>
          <button id="copyBtn" type="button">リンクをコピー</button>
        </div>

        <p class="help">
          ドラッグで移動、ホイール・ピンチで拡大縮小、ダブルクリックで拡大（Shift で縮小）。
          キーボード：矢印キーで移動、<kbd>+</kbd> <kbd>-</kbd> で拡大縮小、<kbd>0</kbd> で初期位置。
        </p>
      </div>
    </details>

    <div class="zoom-buttons">
      <button id="zoomInBtn" type="button" aria-label="拡大">+</button>
      <button id="zoomOutBtn" type="button" aria-label="縮小">−</button>
    </div>

    <div id="hud" class="hud" aria-live="off">
      <div id="hudCenter"></div>
      <div id="hudCursor"></div>
      <div id="hudStatus"></div>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
