name: app-ci

on: [ pull_request ]

permissions:
  contents: read

# 同じ PR で新しく push されたら、古い実行は止める
concurrency:
  group: app-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./wasm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # wasm/rust-toolchain.toml のバージョン・ターゲット・コンポーネントを入れる
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        working-directory: ./wasm
        run: rustup toolchain install
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: frontend/dist
          retention-days: 7
